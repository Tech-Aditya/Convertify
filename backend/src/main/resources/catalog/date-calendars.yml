# ---------------------------------------------------------------------------
# Business-day configuration: weekend presets and holiday calendars.
#
# `recurring` entries (MM-DD) repeat every year; `dates` (YYYY-MM-DD) are
# one-off holidays such as moveable feasts. Add calendars here — no code changes.
# ---------------------------------------------------------------------------
convertify:
  date:
    default-weekend-preset: SAT_SUN
    weekend-presets:
      - { code: SAT_SUN, label: "Saturday & Sunday", days: [SATURDAY, SUNDAY] }
      - { code: FRI_SAT, label: "Friday & Saturday", days: [FRIDAY, SATURDAY] }
      - { code: SUN,     label: "Sunday only",       days: [SUNDAY] }
      - { code: FRI,     label: "Friday only",       days: [FRIDAY] }
      - { code: NONE,    label: "No weekend",        days: [] }

    holiday-calendars:
      - code: IN_NATIONAL
        name: India — National holidays
        description: Republic Day, Independence Day and Gandhi Jayanti.
        recurring: ["01-26", "08-15", "10-02"]
        dates: []

      - code: US_FEDERAL
        name: United States — Federal holidays
        description: Fixed-date federal holidays plus the 2026–2027 observed floating holidays.
        recurring: ["01-01", "06-19", "07-04", "11-11", "12-25"]
        dates:
          - "2026-01-19"
          - "2026-02-16"
          - "2026-05-25"
          - "2026-09-07"
          - "2026-10-12"
          - "2026-11-26"
          - "2027-01-18"
          - "2027-02-15"
          - "2027-05-31"
          - "2027-09-06"
          - "2027-10-11"
          - "2027-11-25"

      - code: UK_ENGLAND
        name: United Kingdom — England & Wales bank holidays
        description: 2026–2027 bank holidays.
        recurring: []
        dates:
          - "2026-01-01"
          - "2026-04-03"
          - "2026-04-06"
          - "2026-05-04"
          - "2026-05-25"
          - "2026-08-31"
          - "2026-12-25"
          - "2026-12-28"
          - "2027-01-01"
          - "2027-03-26"
          - "2027-03-29"
          - "2027-05-03"
          - "2027-05-31"
          - "2027-08-30"
          - "2027-12-27"
          - "2027-12-28"
