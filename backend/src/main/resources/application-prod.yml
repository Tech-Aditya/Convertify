# Production profile: plain INFO logging to console + rolling files, short static caching,
# strict CORS.
spring:
  output:
    ansi:
      enabled: never    # plain console output for log collectors
  web:
    resources:
      cache:
        cachecontrol:
          # Short on purpose: files are not fingerprinted, so this bounds how long a browser runs
          # an old version after a deploy (5 min). It is also below the free-hosting idle sleep
          # (15 min), so a cached page is never shown while the server behind it is asleep.
          max-age: 5m

server:
  forward-headers-strategy: framework
  shutdown: graceful
  # Small instances (e.g. Render free: 512 MB, 0.1 CPU): Tomcat's default of 200 threads only adds
  # memory, since requests take milliseconds and one slow core cannot run more in parallel anyway.
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:20}
      min-spare: 2

# INFO by default; DEBUG only when explicitly requested (LOG_LEVEL_APP=DEBUG).
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.convertify: ${LOG_LEVEL_APP:INFO}
    org.apache.catalina: WARN
    org.springframework.web: WARN

convertify:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  currency:
    provider:
      cache-ttl: ${CURRENCY_CACHE_TTL:12h}
