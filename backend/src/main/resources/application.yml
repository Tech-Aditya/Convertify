# ---------------------------------------------------------------------------
# Convertify — shared configuration (all profiles)
# Profile-specific overrides live in application-{dev,test,prod}.yml.
# Business data (units, land regions, holiday calendars) lives in catalog/*.yml.
# ---------------------------------------------------------------------------
spring:
  application:
    name: convertify
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - classpath:catalog/units.yml
      - classpath:catalog/land-regions.yml
      - classpath:catalog/date-calendars.yml
  mvc:
    problemdetails:
      enabled: false

server:
  # Cloud platforms (Render, Railway) inject PORT; SERVER_PORT still works; 8090 locally.
  port: ${PORT:${SERVER_PORT:8090}}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
  error:
    include-stacktrace: never
    include-message: never

# Health checks for Render/Railway/Kubernetes: only /actuator/health is exposed, and it
# reports UP/DOWN without component details. No other actuator endpoint is reachable.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true    # adds /actuator/health/liveness and /actuator/health/readiness

# Log output is configured in logback-spring.xml; levels are set here.
# Override without code changes, e.g. LOG_LEVEL_APP=DEBUG or --logging.level.com.convertify=DEBUG
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.convertify: ${LOG_LEVEL_APP:INFO}

convertify:
  app:
    name: Convertify
    tagline: Convert. Calculate. Simplify.
    description: Useful everyday conversion and calculation tools.
    version: "@project.version@"

  logging:
    # Read by logback-spring.xml. Rolling files are written unless the "container" profile is
    # active (the Docker image sets it), in which case logs go to stdout only.
    directory: ${LOG_DIR:logs}
    file-name: convertify
    max-file-size: ${LOG_MAX_FILE_SIZE:20MB}        # a day's log rolls into a new part beyond this
    max-history: ${LOG_MAX_HISTORY:30}              # days of application logs to keep
    total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}       # hard ceiling for archived application logs
    error-max-history: ${LOG_ERROR_MAX_HISTORY:90}  # errors are kept longer
    error-total-size-cap: ${LOG_ERROR_TOTAL_SIZE_CAP:256MB}
    # Read by the application
    request-id-header: X-Request-ID
    slow-request-threshold: ${LOG_SLOW_REQUEST_THRESHOLD:1s}

  cors:
    # Comma-separated origins allowed to call /api/** when the frontend is hosted separately.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  conversion:
    # Significant digits used for intermediate BigDecimal arithmetic.
    calculation-precision: 34
    # Values with magnitude >= 1 are rounded to this many decimal places for display.
    max-decimal-places: 6
    # Values with magnitude < 1 are rounded to this many significant digits for display.
    significant-digits: 6
    rounding-mode: HALF_UP
    # Inputs larger than this (in absolute terms) are rejected.
    max-absolute-value: 1000000000000000
    # Inputs with more decimal places than this are rejected (1e-999999999 would otherwise be accepted).
    max-input-decimal-places: 20

  currency:
    base-currency: ${CURRENCY_BASE:USD}
    default-from: USD
    default-to: INR
    featured: [USD, EUR, GBP, INR, JPY, KRW, AUD, CAD, CHF, CNY, SGD, AED]
    # Decimal places shown for exchange rates.
    rate-scale: 6
    # Banker's rounding for monetary results.
    rounding-mode: HALF_EVEN
    provider:
      type: ${CURRENCY_PROVIDER_TYPE:external}
      name: ${CURRENCY_PROVIDER_NAME:ExchangeRate-API (open access)}
      # {base} is replaced by the base currency; {apiKey} by CURRENCY_API_KEY (if the provider needs it in the path).
      url: ${CURRENCY_PROVIDER_URL:https://open.er-api.com/v6/latest/{base}}
      api-key: ${CURRENCY_API_KEY:}
      # Optional HTTP header used to send the API key, e.g. "apikey" or "Authorization".
      api-key-header: ${CURRENCY_API_KEY_HEADER:}
      connect-timeout: 5s
      read-timeout: 10s
      cache-ttl: ${CURRENCY_CACHE_TTL:6h}
      # After a failed refresh, wait this long before contacting the provider again.
      failure-backoff: 1m

  travel:
    distance-category: LENGTH
    speed-category: SPEED
    time-category: TIME
    # Units every quantity is normalised to before the formula is applied.
    normalized-distance-unit: m
    normalized-speed-unit: mps
    normalized-time-unit: s
    default-time-result-unit: h
    default-distance-unit: km
    default-speed-unit: kmh

  date:
    default-time-zone: ${DATE_DEFAULT_TIME_ZONE:Asia/Kolkata}
    max-shift-amount: 100000
    # ~1,000 years; bounds the business-day scan for date differences.
    max-range-days: 366000
    min-year: 1
    max-year: 9999

  land:
    default-region: ${LAND_DEFAULT_REGION:WEST_BENGAL}
    area-category: AREA
